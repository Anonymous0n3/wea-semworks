services:
  webapplication1:
    build:
      context: .
      dockerfile: WebApplication1/Dockerfile
    env_file:
      - .env
    ports:
      - "8003:8080"   # venkovní port 8003 → uvnitř kontejneru 8080
    volumes:
      - /home/cerny/logs/sk04:/var/log/webapp
    networks:
      - appnet

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "84:80"       # HTTP
      - "447:443"     # HTTPS
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - appnet
    depends_on:
      - webapplication1

  couchdb:
    image: couchdb:3.3
    ports:
      - "5987:5984"
    env_file:
      - .env
    volumes:
      - couchdb-data:/opt/couchdb/data
    networks:
      - appnet

volumes:
  caddy_data:
  caddy_config:
  couchdb-data:

networks:
  appnet:
    driver: bridge
