services:
  webapplication1:
    build:
      context: .
      dockerfile: WebApplication1/Dockerfile
    environment:
      - COUCHDB_URL=http://couchdb:5984
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpassword
      - APP_LOG_PATH=/var/log/webapp/app.log
      - BACKEND_BASE_URL
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - couchdb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 5s
      retries: 5
      start_period: 5s
    volumes:
      - /home/cerny/logs/sk04:/var/log/webapp
    networks:
      - appnet

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    depends_on:
      webapplication1:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - appnet

  couchdb:
    image: couchdb:3.3
    ports:
      - "5987:5984"
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpassword
      - COUCHDB_SINGLE_NODE=true
    volumes:
      - couchdb-data:/opt/couchdb/data
    networks:
      - appnet

volumes:
  caddy_data:
  caddy_config:
  couchdb-data:

networks:
  appnet:
    driver: bridge
