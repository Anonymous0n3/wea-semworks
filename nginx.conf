# -------------------------------------------------------------------------
# HTTP SERVER
# Poslouchá uvnitø kontejneru na portu 80 (zvenku mapováno na 84)
# -------------------------------------------------------------------------
server {
    listen 80;
    server_name wea.nti.tul.cz;

    # Pøesmìrování veškerého provozu na HTTPS
    # $host = wea.nti.tul.cz
    # 447 = Váš externí HTTPS port
    return 301 https://$host:447$request_uri;
}

# -------------------------------------------------------------------------
# HTTPS SERVER
# Poslouchá uvnitø kontejneru na portu 443 (zvenku mapováno na 447)
# -------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name wea.nti.tul.cz;

    # SSL Certifikáty
    ssl_certificate /etc/nginx/certs/wea.crt;
    ssl_certificate_key /etc/nginx/certs/wea.key;

    # Bezpeènostní nastavení SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ----------------------------------------------------------
    # HLAVNÍ APLIKACE (/sk04-web/)
    # ----------------------------------------------------------
    location /sk04-web/ {
        # 1. Base Path pro .NET Core (aby aplikace vìdìla, že bìží v podadresáøi)
        proxy_set_header X-Forwarded-Path-Base /sk04-web;

        # 2. Nastavení hlavièek pro správnou identifikaci klienta a portu
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # DÙLEŽITÉ: Øíkáme aplikaci, že zvenku bìžíme na HTTPS a portu 447
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 447;
        
        # DÙLEŽITÉ PRO GOOGLE LOGIN: Udržuje pùvodní hlavièku hosta i s portem (pokud ho klient poslal)
        proxy_set_header X-Forwarded-Host $host:447;

        # Timeouty
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;

        # 3. Proxy Pass s odstranìním prefixu
        # Všimnìte si lomítka na konci URL (http://...:8080/)
        # To automaticky odstraní "/sk04-web/" z cesty pøed posláním do kontejneru.
        proxy_pass http://webapplication1:8080/;
    }

    # ----------------------------------------------------------
    # FALLBACK PRO STATICKÉ SOUBORY (CSS, JS, Obrázky)
    # ----------------------------------------------------------
    # Pokud aplikace vygeneruje odkaz špatnì (napø. /css/site.css místo /sk04-web/css/site.css),
    # tento blok to zachytí a pošle na backend, aby se stránka nerozpadla.
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 447;

        proxy_pass http://webapplication1:8080/;
    }
}