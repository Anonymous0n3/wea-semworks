# HTTP Server (Externí port 84 -> Vnitøní port 80)
server {
    listen 80;
    # PØIDÁNO: localhost
    server_name wea.nti.tul.cz localhost; 

    # Automatické pøesmìrování na HTTPS s portem 447
    # $host se dynamicky zmìní na "localhost" nebo "wea.nti.tul.cz"
    return 301 https://$host:447$request_uri;
}

# HTTPS Server (Externí port 447 -> Vnitøní port 443)
server {
    listen 443 ssl;
    # PØIDÁNO: localhost
    server_name wea.nti.tul.cz localhost;

    # Certifikáty
    # POZOR: Na localhostu bude prohlížeè hlásit chybu certifikátu, 
    # protože "wea.crt" je pro TUL, ne pro localhost. To je OK, staèí dát "Pokraèovat".
    ssl_certificate /etc/nginx/certs/wea.crt;
    ssl_certificate_key /etc/nginx/certs/wea.key;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Globální nastavení proxy hlavièek
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Dùležité: Øíká aplikaci, že veøejný port je 447
    proxy_set_header X-Forwarded-Port 447;

    # Timeouty
    proxy_read_timeout 300;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;

    # 1. PØÍPAD: Hlavní vstupní bod aplikace (/sk04-web/)
    location /sk04-web/ {
        proxy_set_header X-Forwarded-Path-Base /sk04-web;
        rewrite ^/sk04-web/(.*)$ /$1 break;
        proxy_pass http://webapplication1:8080;
    }

    # 2. PØÍPAD: Fallback
    location / {
        proxy_pass http://webapplication1:8080;
    }
}