# HTTP Server (Externí 84 -> Vnitøní 80)
server {
    listen 80;
    # 1. PØIDÁNO: localhost
    server_name wea.nti.tul.cz localhost;

    # Redirect na HTTPS (zachová hostname i port 447)
    return 301 https://$host:447$request_uri;
}

# HTTPS Server (Externí 447 -> Vnitøní 443)
server {
    listen 443 ssl;
    # 2. PØIDÁNO: localhost
    server_name wea.nti.tul.cz localhost;

    ssl_certificate /etc/nginx/certs/wea.crt;
    ssl_certificate_key /etc/nginx/certs/wea.key;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Globální proxy hlavièky
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port 447;

    # Timeouty
    proxy_read_timeout 300;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;

    # --- OPRAVA PRO CHYBÌJÍCÍ LOMÍTKO ---
    # Pokud uživatel zadá "localhost/sk04-web" (bez lomítka na konci),
    # prohlížeè si myslí, že sk04-web je soubor, ne složka, a rozbijí se relativní cesty k CSS.
    # Toto pravidlo ho pøesmìruje na "localhost/sk04-web/"
    location = /sk04-web {
        return 301 https://$host:447/sk04-web/;
    }

    # 1. PØÍPAD: Aplikace na /sk04-web/
    location /sk04-web/ {
        # Informace pro C# aplikaci, že bìží v podadresáøi
        proxy_set_header X-Forwarded-Path-Base /sk04-web;

        # Oøíznutí prefixu: /sk04-web/Home/Index -> /Home/Index
        rewrite ^/sk04-web/(.*)$ /$1 break;

        proxy_pass http://webapplication1:8080;
    }

    # 2. PØÍPAD: Fallback (pokud by nìco propadlo nebo pro root pøístup)
    location / {
        proxy_pass http://webapplication1:8080;
    }
}