# HTTP Server (Port 84)
server {
    listen 80;
    server_name wea.nti.tul.cz;
    # Automatické pøesmìrování z HTTP (port 84) na HTTPS (port 447)
    return 302 https://$host:447$request_uri;
}

# HTTPS Server (Port 447)
server {
    listen 443 ssl;
    server_name wea.nti.tul.cz;

    # Certy
    ssl_certificate /etc/nginx/certs/wea.crt;
    ssl_certificate_key /etc/nginx/certs/wea.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Definice hlavièek pro zjednodušení
    location / {
        # Hlavièky pro ASP.NET Core
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; 
        
        # Klíèové: Musíme pøedat i base path hlavièku, aby aplikace fungovala správnì
        proxy_set_header X-Forwarded-Path-Base /sk04-web;
        
        # Zvýšení timeoutu, pokud by aplikace startovala déle
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;

        # 1. PØÍPAD: Pøístup na hlavní URL s prefixem /sk04-web/
        # NGINX zde odstraní prefix /sk04-web/ a pošle zbytek na backend:
        # Pøíklad: /sk04-web/Home/Index -> http://webapplication1:8080/Home/Index
        # Toto by mìlo platit pro navigaci a routování.
        location ^~ /sk04-web/ {
            # Odstranìní prefixu /sk04-web/ pøed odesláním do backendu
            rewrite ^/sk04-web/(.*)$ /$1 break;
            proxy_pass http://webapplication1:8080;
        }

        # 2. PØÍPAD: Pøístup na statické soubory, které aplikace vygenerovala bez prefixu
        # Pøíklad: /css/site.css, /lib/bootstrap/...
        # Toto zachytí požadavky, které nezaèaly na /sk04-web/, ale jsou statické soubory aplikace.
        # Pošleme je rovnou na backend, který je obslouží.
        location / {
            proxy_pass http://webapplication1:8080;
        }
    }
}