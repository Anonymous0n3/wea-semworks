# HTTP Server (Externí port 84 -> Vnitøní port 80)

server {

    listen 80;

    server_name wea.nti.tul.cz;



    # Automatické pøesmìrování na HTTPS s portem 447

    return 301 https://$host:447$request_uri;

}



# HTTPS Server (Externí port 447 -> Vnitøní port 443)

server {
    listen 443 ssl;
    server_name wea.nti.tul.cz;

    # Certifikáty
    ssl_certificate /etc/nginx/certs/wea.crt;
    ssl_certificate_key /etc/nginx/certs/wea.key;

    # Proxy hlavièky
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port 447; # Dùležité pro generování HTTPS odkazù

    # 1. PØÍPAD: Aplikace na podcestì /sk04-web
    # Všimnìte si, že zde není lomítko na konci location, aby chytalo i /sk04-web bez lomítka
    location /sk04-web {
        # Posíláme požadavek i s cestou /sk04-web backendu
        proxy_pass http://webapplication1:8080;
        
        # Timeouty
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    # 2. PØÍPAD: Fallback (volitelné, pro jistotu)
    location / {
        proxy_pass http://webapplication1:8080;
    }
}