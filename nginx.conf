# HTTP Server (Naslouchá na portu 80, mapovanı na externí port 84)
server {
    listen 80;
    server_name wea.nti.tul.cz;

    # Automatické pøesmìrování z HTTP (port 84) na HTTPS (port 447)
    # Zabezpeèuje, e veškerá komunikace bude probíhat pøes HTTPS.
    return 301 https://$host:447$request_uri;
}

# HTTPS Server (Naslouchá na portu 443, mapovanı na externí port 447)
server {
    listen 443 ssl;
    server_name wea.nti.tul.cz;

    # Cesty k certifikátu a klíèi
    # Tyto soubory jsou namapovány z lokální sloky 'certs' do kontejneru NGINX.
    ssl_certificate /etc/nginx/certs/wea.crt;
    ssl_certificate_key /etc/nginx/certs/wea.key;

    # TLS protokoly a šifry pro zvıšenou bezpeènost
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Reverzní proxy pro aplikaèní provoz
    # Vše, co pøijde na wea.nti.tul.cz:447/sk04-web/, se pøesmìruje na webapplication1:8080.
    location /sk04-web/ {
        # Proxy_pass smìruje poadavek na interní slubu 'webapplication1' na portu 8080
        # Pouívá interní Docker sí, take komunikace je HTTP.
        proxy_pass http://webapplication1:8080/;

        # Nastavení hlavièek pro správné pøedání informací o klientovi backendu
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https; # Informuje backend, e komunikace byla HTTPS
    }
}