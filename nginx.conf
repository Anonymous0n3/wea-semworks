# HTTP Server (Port 80 uvnitø, 84 venku) -> Redirect na HTTPS
server {
    listen 80;
    server_name wea.nti.tul.cz;
    return 301 https://$host:447$request_uri;
}

# HTTPS Server (Port 443 uvnitø, 447 venku)
server {
    listen 443 ssl;
    server_name wea.nti.tul.cz;

    # Certifikáty
    ssl_certificate /etc/nginx/certs/wea.crt;
    ssl_certificate_key /etc/nginx/certs/wea.key;

    # Proxy hlavièky
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 447;
    proxy_set_header X-Forwarded-Host $host:447;

    # 1. Øešení chybìjícího lomítka (sk04-web -> sk04-web/)
    location = /sk04-web {
        return 301 https://$host:447/sk04-web/;
    }

    # 2. Hlavní routování aplikace
    location /sk04-web/ {
        # Øekneme .NETu, že bìží v podadresáøi
        proxy_set_header X-Forwarded-Path-Base /sk04-web;

        # DÙLEŽITÉ: Lomítko na konci adresy proxy_pass zajistí odstranìní "/sk04-web/"
        # Pøíchozí: /sk04-web/Home/Index
        # Do aplikace jde: /Home/Index
        proxy_pass http://webapplication1:8080/; 
        
        proxy_read_timeout 300;
    }

    # 3. Fallback (pokud by aplikace naèítala scripty z rootu)
    # Toto je pojistka, kdyby .NET vygeneroval špatný odkaz
    location / {
        proxy_pass http://webapplication1:8080/;
    }
}