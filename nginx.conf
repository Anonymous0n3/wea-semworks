# HTTP Server (Externí port 84 -> Vnitøní port 80)
server {
    listen 80;
    server_name wea.nti.tul.cz;

    # Automatické pøesmìrování na HTTPS s portem 447
    return 301 https://$host:447$request_uri;
}

# HTTPS Server (Externí port 447 -> Vnitøní port 443)
server {
    listen 443 ssl;
    server_name wea.nti.tul.cz;

    # Certifikáty (cesty uvnitø kontejneru)
    ssl_certificate /etc/nginx/certs/wea.crt;
    ssl_certificate_key /etc/nginx/certs/wea.key;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Globální nastavení proxy hlavièek (platí pro všechny location níže)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Dùležité: Øekneme aplikaci, že bìží na portu 447 a ne 443
    proxy_set_header X-Forwarded-Port 447;

    # Timeouty
    proxy_read_timeout 300;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;

    # 1. PØÍPAD: Hlavní vstupní bod aplikace (/sk04-web/)
    location /sk04-web/ {
        # Nastavíme Base Path hlavièku pro ASP.NET Core
        proxy_set_header X-Forwarded-Path-Base /sk04-web;

        # Odstraníme prefix /sk04-web/ z URL pøed posláním na backend
        # Pøíklad: /sk04-web/Home/Index -> /Home/Index
        rewrite ^/sk04-web/(.*)$ /$1 break;

        proxy_pass http://webapplication1:8080;
    }

    # 2. PØÍPAD: Fallback pro statické soubory nebo cesty bez prefixu
    # Pokud aplikace vygeneruje odkaz "/css/site.css" místo "/sk04-web/css/site.css",
    # tento blok to zachytí a pošle správnì na backend.
    location / {
        proxy_pass http://webapplication1:8080;
    }
}