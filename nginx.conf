# HTTP Server (Naslouchá na portu 80, mapovaný na externí port 84)
server {
    listen 80;
    server_name wea.nti.tul.cz;

    # Automatické pøesmìrování z HTTP (port 84) na HTTPS (port 447)
    # Tím je vynucena HTTPS komunikace
    return 301 https://$host:447$request_uri;
}

# HTTPS Server (Naslouchá na portu 443, mapovaný na externí port 447)
server {
    listen 443 ssl;
    server_name wea.nti.tul.cz;

    # Cesty k certifikátu a klíèi (mapováno z hostitele: ./certs/)
    ssl_certificate /etc/nginx/certs/wea.crt;
    ssl_certificate_key /etc/nginx/certs/wea.key;

    # Doporuèené protokoly a šifry
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Reverzní proxy pro aplikaèní provoz
    # Zachycuje požadavky na cestì /sk04-web/
    location /sk04-web/ {
        # Proxy_pass smìruje požadavek na interní službu 'webapplication1' na portu 8080.
        proxy_pass http://webapplication1:8080/;

        # --- KRITICKÉ HLAVIÈKY PRO ASP.NET CORE A PATH BASE ---
        
        # 1. Host: Zajištìní, že se správnì pøedá název hostitele
        proxy_set_header Host $host;
        
        # 2. X-Forwarded-For: Pøedání informací o pùvodní IP adrese klienta
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 3. X-Forwarded-Proto: CRITICAL: øíká backendu, že pùvodní komunikace byla HTTPS
        proxy_set_header X-Forwarded-Proto $scheme; 
        
        # 4. X-Forwarded-Prefix: Explicitní definice prefixu cesty (pojistka pro ASP.NET PathBase)
        proxy_set_header X-Forwarded-Prefix /sk04-web; 
        
        # --- KONEC HLAVIÈEK ---
    }
}