name: Update Contributor Stats

on:
  schedule:
    - cron: '0 0 * * 0' # Spustí se každou neděli o půlnoci
  workflow_dispatch: # Umožní ruční spuštění tlačítkem

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Důležité: umožní robotovi zapisovat do repozitáře
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update_stats.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "docs: aktualizace statistik přispěvatelů"
          file_pattern: README.md
