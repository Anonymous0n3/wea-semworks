name: Metrics
on:
  schedule: [{cron: "0 0 * * 0"}] # Run weekly
  workflow_dispatch:              # Run manually

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Your GitHub Personal Access Token (REQUIRED for speed & accuracy)
          token: ${{ secrets.METRICS_TOKEN }} 

          # Options
          user: Anonymous0n3
          repo: wea-smeworks
          filename: contributors.svg
          
          # Plugin Settings
          plugin_contributors: yes
          plugin_contributors_base: "" # This ensures it focuses purely on contributors
          
          # SAFETY: Do not use "fetch-depth" in checkout for this config.
          # The token allows the tool to ask the API directly.
