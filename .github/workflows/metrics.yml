name: Contributors Leaderboard
on:
  # Update every Sunday at midnight
  schedule: [{cron: "0 0 * * 0"}]
  # Run when pushing to main
  push: {branches: ["master"]}
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  #
      - uses: lowlighter/metrics@latest
        with:
          filename: contributors.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Anonymous0n3    # The owner of the repo
          repo: wea-semworks          # The exact name of the repo
          plugin_contributors: yes
          plugin_contributors_sections: contributors
          plugin_contributors_head: master
          plugin_contributors_base: ""
